[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "signsync-oss"
version = "0.1.0"
description = "Verify Ring webhooks and summarize hand landmarks without faces or video."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Axon Enjin" }]

[tool.setuptools.packages.find]
include = ["signsync_oss*"]
